{% load static %}
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Sign Up</title>
    {% tailwind_css %}
</head>

<body
    class="min-h-screen bg-gradient-to-br from-teal-100 via-white to-emerald-100 flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white shadow-2xl rounded-2xl p-8 border border-slate-200">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Driver Sign Up</h1>
            <p class="text-slate-500 mt-2">Create your driver account</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 px-4 py-3 rounded-lg text-sm
                    {% if message.tags == 'error' %}
                        bg-red-100 text-red-700
                    {% elif message.tags == 'success' %}
                        bg-green-100 text-green-700
                    {% else %}
                        bg-gray-100 text-gray-700
                    {% endif %}
                ">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username" required
                class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">

            <input type="email" name="email" placeholder="Email" required
                class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">

            <input type="password" name="password1" placeholder="Password" required
                class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">

            <input type="password" name="password2" placeholder="Confirm Password" required
                class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">

            <button type="submit"
                class="w-full bg-emerald-600 text-white py-3 rounded-xl hover:bg-emerald-700 transition duration-200">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-slate-600">
                Already have an account?
                <a href="{% url 'driver_signin' %}" class="text-emerald-600 hover:underline font-medium">
                    Sign In
                </a>
            </p>
        </div>

        <div class="mt-3 text-center">
            <a href="/" class="text-sm text-gray-500 hover:underline">
                Back to Home
            </a>
        </div>
    </div>

</body>

</html>
