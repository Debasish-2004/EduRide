{% load static %}
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Sign In</title>
    {% tailwind_css %}
</head>

<body
    class="min-h-screen bg-gradient-to-br from-emerald-100 via-white to-teal-100 flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white shadow-2xl rounded-2xl p-8 border border-slate-200">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Driver Sign In</h1>
            <p class="text-slate-500 mt-2">Login to access your driver dashboard</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 px-4 py-3 rounded-lg text-sm
                    {% if message.tags == 'error' %}
                        bg-red-100 text-red-700
                    {% elif message.tags == 'success' %}
                        bg-green-100 text-green-700
                    {% else %}
                        bg-gray-100 text-gray-700
                    {% endif %}
                ">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-2">
                    Username
                </label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
                    Password
                </label>
                <input type="password" name="password" id="password" placeholder="Enter your password" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition duration-200">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-slate-600">
                Don't have an account?
                <a href="{% url 'driver_signup' %}" class="text-emerald-600 hover:underline font-medium">
                    Sign up
                </a>
            </p>
        </div>

        <div class="mt-3 text-center">
            <a href="/" class="text-sm text-gray-500 hover:underline">
                Back to Home
            </a>
        </div>
    </div>

</body>

</html>
