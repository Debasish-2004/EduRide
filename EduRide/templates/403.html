{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Expired — EduRide</title>
    {% tailwind_css %}
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4">

    <div class="text-center max-w-md">
        <div class="text-6xl mb-4">🔒</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Session Expired</h1>
        <p class="text-gray-600 mb-6">
            Your session or form token has expired. This usually happens if the page was open for too long.
            Please go back and try again.
        </p>
        <a href="javascript:history.back()"
           class="inline-block px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition">
            ← Go Back & Retry
        </a>
        <div class="mt-4">
            <a href="/" class="text-sm text-gray-500 hover:underline">Go to Home</a>
        </div>
    </div>

</body>
</html>
