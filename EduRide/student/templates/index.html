
{% extends "layout.html" %}
{% load static %}
{% block title %}Home Page{% endblock title %}
{% block content %}
<div class="min-h-screen w-full flex flex-col lg:flex-row bg-gray-100">

    <!-- Map section -->
    <div class="w-full lg:w-[70%] h-[80vh] lg:h-screen p-3 lg:p-4">
        <div class="bg-white rounded-2xl shadow-md h-full overflow-hidden border border-gray-200">
            <div class="px-4 py-3 lg:px-5 lg:py-4 border-b border-gray-200 flex items-center justify-between gap-3">
                <div>
                    <h1 class="text-xl lg:text-2xl font-bold text-gray-800">Live Bus Tracking</h1>
                    <p class="text-sm text-gray-500">See your institute buses in real time</p>
                </div>
                <button
                    id="current-location-btn"
                    type="button"
                    class="shrink-0 px-3 py-2 bg-slate-700 text-white rounded-lg text-sm hover:bg-slate-800 transition">
                    📍
                </button>
            </div>

           <div id="map" class="w-full h-[65vh] md:h-[calc(100%-80px)]"></div>

        </div>
    </div>

    <!-- Bus list section -->
    <div class="w-full lg:w-[30%] h-auto lg:h-screen p-3 lg:p-4 lg:pl-0">
        <div class="bg-white rounded-2xl shadow-md h-full border border-gray-200 flex flex-col">
            <div class="px-4 py-3 lg:px-5 lg:py-4 border-b border-gray-200">
                <h2 class="text-lg lg:text-xl font-semibold text-gray-800">Institute Buses</h2>
                <p class="text-sm text-gray-500">Click any bus to view its location</p>
            </div>

            <div class="p-3 lg:p-4 overflow-y-auto space-y-3" id="bus-list">
                <!-- Bus cards will be inserted here -->
            </div>
        </div>
    </div>

</div>

<!-- this is availble at leafjet.js ,,, cdn packages.-->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- This is for the bus fetched from the DB in json-->
 {{ buses|json_script:"buses-data" }}
<script>
    //json style buses data. Each bus includes a small "routeCoords" polyline for display. now from db..

   const buses = JSON.parse(document.getElementById("buses-data").textContent);

   //Available in Leaflet.js website . overview section...
    const map = L.map('map').setView([20.2961, 85.8245], 11);

    //map layers
    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    });

    const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    });

    const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    });

    const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors, SRTM | OpenTopoMap'
    });

    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    });

    const baseLayers = {
        "Street (OSM)": streetLayer,
        "Dark": darkLayer,
        "Light": lightLayer,
        "Topographic": topoLayer,
        "Satellite": satelliteLayer
    };
    // if there is dark theme on in system then it will show dark map by default.
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const defaultLayer = prefersDark ? darkLayer : streetLayer;
    defaultLayer.addTo(map);

    L.control.layers(baseLayers, {}, { collapsed: true }).addTo(map);

    const markers = {};

    // Grey marker icon for offline buses
    const offlineIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-grey.png',
        iconRetinaUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-grey.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });

    // Bus emoji icon for active buses
    const busIcon = L.divIcon({
        html: '<div style="font-size:28px;line-height:1;filter:drop-shadow(1px 2px 2px rgba(0,0,0,0.3));">🚌</div>',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -16],
        className: '',  // Remove default Leaflet div-icon styling
    });

    //showing the bus popup when the marker is clicked.
    buses.forEach(bus => {
        const markerOptions = bus.is_active ? { icon: busIcon } : { icon: offlineIcon, opacity: 0.5 };
        const statusLabel = bus.is_active
            ? '<span style="color:green;font-weight:bold;">● Active</span>'
            : '<span style="color:gray;">○ Offline</span>';

        const marker = L.marker([bus.lat, bus.lng], markerOptions)
            .addTo(map)
            .bindPopup(`
                <div style="min-width:180px">
                    <h3 style="font-weight:bold;">${bus.bus_no}</h3>
                    <p>Route: ${bus.route}</p>
                    <p>${statusLabel}</p>
                </div>
            `);

        markers[bus.id] = marker;
    });

    const busList = document.getElementById("bus-list");
    const currentLocationBtn = document.getElementById("current-location-btn");

    // Use a green marker icon for user location (Leaflet default is blue)
    const currentLocationIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
        iconRetinaUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });

    let currentLocationMarker = null;
    let currentRouteLine = null;

    //listing the cards in buslist...
    if (buses.length === 0) {
    busList.innerHTML = `<p class="text-sm text-gray-500">No buses available.</p>`;
    }
    else{
        buses.forEach(bus => {
            const card = document.createElement("div");
            // Offline buses get low opacity to visually distinguish them
            card.className = "p-4 rounded-xl border border-gray-200 hover:bg-blue-50 cursor-pointer transition";
            if (!bus.is_active) {
                card.style.opacity = "0.45";
            }

            const statusBadge = bus.is_active
                ? '<span class="inline-block px-2 py-0.5 bg-green-100 text-green-700 rounded-full text-xs font-medium">Active</span>'
                : '<span class="inline-block px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full text-xs font-medium">Offline</span>';

            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <h3 class="text-base lg:text-lg font-semibold text-gray-800">${bus.bus_no}</h3>
                    ${statusBadge}
                </div>
                <p class="text-sm text-gray-600 mt-1"><span class="font-medium">Route:</span> ${bus.route}</p>
                <button class="mt-3 px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">
                    View Location
                </button>
            `;

            card.addEventListener("click", () => {
                // Hide all other bus markers
                Object.values(markers).forEach(m => {
                    if (m !== markers[bus.id]) {
                        map.removeLayer(m);
                    }
                });

                // Add the selected bus marker (if it was removed)
                if (!map.hasLayer(markers[bus.id])) {
                    markers[bus.id].addTo(map);
                }

                // Draw the bus path (polyline) and remove the old one if exists
                if (currentRouteLine) {
                    map.removeLayer(currentRouteLine);
                }
                if (bus.routeCoords && bus.routeCoords.length > 1) {
                    currentRouteLine = L.polyline(bus.routeCoords, { color: 'blue', weight: 4, opacity: 0.7 }).addTo(map);
                    map.fitBounds(currentRouteLine.getBounds(), { padding: [50, 50] });
                } else {
                    map.setView([bus.lat, bus.lng], 14, { animate: true });
                }

                markers[bus.id].openPopup();
            });

            busList.appendChild(card);
        });
    }

    // Recenter map to user's current location on button click.
    currentLocationBtn.addEventListener("click", () => {
        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser.");
            return;
        }

        currentLocationBtn.disabled = true;
        currentLocationBtn.textContent = "Locating...";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const { latitude, longitude } = position.coords;
                map.setView([latitude, longitude], 15, { animate: true });

                if (currentLocationMarker) {
                    currentLocationMarker.setLatLng([latitude, longitude]);
                } else {
                    currentLocationMarker = L.marker([latitude, longitude], { icon: currentLocationIcon })
                        .addTo(map)
                        .bindPopup("You are here");
                }
                currentLocationMarker.openPopup();

                currentLocationBtn.disabled = false;
                currentLocationBtn.textContent = "📍";
            },
            () => {
                alert("Unable to fetch your current location. Please allow location access.");
                currentLocationBtn.disabled = false;
                currentLocationBtn.textContent = "📍";
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    });

    // Important fix for Leaflet on responsive layouts
    window.addEventListener("load", () => {
        setTimeout(() => {
            map.invalidateSize();
        }, 200);
    });

    window.addEventListener("resize", () => {
        setTimeout(() => {
            map.invalidateSize();
        }, 200);
    });

    // =====================================================================
    //  LIVE POLLING — Fetch updated bus positions every 5 seconds
    // =====================================================================

    const POLL_INTERVAL_MS = 5000;
    const POLL_URL = "{% url 'bus_locations_api' %}";

    /**
     * Format an ISO timestamp into a human-friendly "X seconds/minutes ago" string.
     */
    function timeAgo(isoString) {
        if (!isoString) return "No GPS data";
        const diff = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
        if (diff < 10) return "Just now";
        if (diff < 60) return diff + "s ago";
        if (diff < 3600) return Math.floor(diff / 60) + "m ago";
        return Math.floor(diff / 3600) + "h ago";
    }

    /**
     * Poll the server for updated bus locations and move markers.
     */
    function pollBusLocations() {
        fetch(POLL_URL)
            .then(response => {
                if (!response.ok) throw new Error("Poll failed");
                return response.json();
            })
            .then(updatedBuses => {
                updatedBuses.forEach(bus => {
                    const marker = markers[bus.id];
                    if (!marker) return;  // Bus wasn't on the initial page load

                    // ── Move the marker to the new position ──
                    marker.setLatLng([bus.lat, bus.lng]);

                    // ── Update marker style based on active/offline ──
                    if (bus.is_active) {
                        marker.setIcon(busIcon);
                        marker.setOpacity(1.0);
                    } else {
                        marker.setIcon(offlineIcon);
                        marker.setOpacity(0.5);
                    }

                    // ── Update the popup content ──
                    const statusLabel = bus.is_active
                        ? '<span style="color:green;font-weight:bold;">● Active</span>'
                        : '<span style="color:gray;">○ Offline</span>';

                    const lastUpdated = bus.is_active && bus.last_updated
                        ? '<p style="font-size:12px;color:#888;">📡 ' + timeAgo(bus.last_updated) + '</p>'
                        : '';

                    marker.setPopupContent(`
                        <div style="min-width:180px">
                            <h3 style="font-weight:bold;">${bus.bus_no}</h3>
                            <p>Route: ${bus.route}</p>
                            <p>${statusLabel}</p>
                            ${lastUpdated}
                        </div>
                    `);

                    // ── Update the bus card in the sidebar ──
                    const cards = busList.querySelectorAll("div.rounded-xl");
                    // Match by index (buses are rendered in the same order)
                    const idx = updatedBuses.indexOf(bus);
                    if (cards[idx]) {
                        const card = cards[idx];
                        card.style.opacity = bus.is_active ? "1" : "0.45";

                        const badge = card.querySelector("span.inline-block");
                        if (badge) {
                            if (bus.is_active) {
                                badge.className = "inline-block px-2 py-0.5 bg-green-100 text-green-700 rounded-full text-xs font-medium";
                                badge.textContent = "Active";
                            } else {
                                badge.className = "inline-block px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full text-xs font-medium";
                                badge.textContent = "Offline";
                            }
                        }
                    }
                });
            })
            .catch(() => {
                // Silently retry on next interval — don't break the UI
            });
    }

    // Start polling after a short delay to let the page settle
    setTimeout(() => {
        setInterval(pollBusLocations, POLL_INTERVAL_MS);
    }, POLL_INTERVAL_MS);

</script>
{% endblock %}
